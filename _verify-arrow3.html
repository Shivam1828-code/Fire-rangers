<pre id="dump"></pre>
<script>
window.addEventListener('load',function(){setTimeout(function(){
 var li=document.querySelectorAll('.mobile-menu .navigation li.dropdown');
 var d='mobile menu dropdown items='+li.length;
 if(li.length){
   var b=document.createElement('div');b.className='dropdown-btn';
   b.innerHTML='<span class="fas fa-angle-down"></span>';
   li[0].appendChild(b);
 }
 var btn=document.querySelector('.mobile-menu .fire-rangers-products-menu > .dropdown-btn');
 d+='\nbtn exists='+(!!btn);
 if(btn){var s=getComputedStyle(btn);d+='\ndisplay='+s.display;}
 else{d+='\nno dropdown-btn target';}
 document.getElementById('dump').textContent=d;
},500);});
</script>
